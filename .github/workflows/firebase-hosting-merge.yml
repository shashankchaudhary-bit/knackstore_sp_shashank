name: Deploy to Firebase Hosting on merge to QA

on:
  push:
    branches:
      - qa

jobs:
  build_and_deploy_frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Verify Build Output        # ← Fails loudly if build didn't work
        run: |
          echo "=== Checking dist ===" 
          ls -la frontend/dist/ || (echo "BUILD FAILED - no dist folder" && exit 1)
          ls -la frontend/dist/electronics-store-ui/ || (echo "Wrong project name in dist" && exit 1)
          find frontend/dist -type d

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HACKATHON_7B9F7 }}
          channelId: live
          projectId: hackathon-7b9f7